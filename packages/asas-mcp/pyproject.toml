[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "asas-mcp"
version = "0.12.0"
description = "Asas MCP module: a remote Model Context Protocol server core — stateless streamable HTTP over the low-level SDK server with verbatim tool schemas, honest annotations, prompt templates, and an optional composed bearer-auth stack."
readme = "README.md"
requires-python = ">=3.11"
license = "Apache-2.0"
license-files = ["LICENSE", "NOTICE"]
classifiers = [
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3",
    "Framework :: FastAPI",
    "Intended Audience :: Developers",
]
dependencies = [
    "mcp>=1.9,<2",
    "anyio>=4",
    "starlette>=0.37",
    "pydantic>=2",
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "httpx>=0.27",
]

[tool.hatch.build.targets.wheel]
packages = ["src/asas_mcp"]

[tool.pytest.ini_options]
testpaths = ["tests"]
