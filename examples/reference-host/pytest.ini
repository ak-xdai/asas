[pytest]
# Put the reference host's own directory on sys.path so `import app` resolves.
#
# Needed because `app` is a plain directory, not an installed package — this
# host is deliberately not installable (nobody should `pip install` a reference
# application). The package suites elsewhere in this repo do not need this,
# because they import a package pip has already installed.
#
# Declared here rather than relied on implicitly: `python -m pytest` happens to
# put the working directory on sys.path, while bare `pytest` does not, so
# without this the suite passes locally and fails in CI. That asymmetry is
# exactly what it did.
pythonpath = .
